[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "barewingui"
version = "0.1.0"
description = "Deterministic, zero-dependency native Win32 GUI framework for Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Bastian Flügel" }
]
keywords = [
    "win32",
    "gui",
    "desktop",
    "native",
    "ctypes",
    "zero-dependency",
    "windows"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed"
]
dependencies = []

[project.urls]
Homepage = "https://bastian-fluegel.de"
Repository = "https://github.com/bastian-fluegel/barewingui"
Issues = "https://github.com/bastian-fluegel/barewingui/issues"