[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "barewingui"
version = "0.1.0"
description = "Pure Win32 GUI bindings for Python without runtime dependencies or C compilers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bastian Flügel"}
]
keywords = ["win32", "gui", "ctypes", "native", "windows", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

# Zero Dependencies als architektonisches Statement
dependencies = []

[project.urls]
Homepage = "https://bastian-fluegel.de"
Repository = "https://github.com/bastian-fluegel/barewingui"

[tool.flit.sdist]
exclude = [
    ".git*",
    "examples/",
    "tests/",
]