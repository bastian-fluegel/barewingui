name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic:
    # Pure-Python parts (layout engine, scaling, dispatch) on every platform.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q barewingui
      - run: python -m unittest discover -s tests -v

  windows:
    # The same suite plus the Win32 smoke tests (real windows, real message loop).
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        architecture: ["x64"]
        include:
          - python-version: "3.12"
            architecture: "x86"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> test-output.txt
          $code = $LASTEXITCODE
          Get-Content test-output.txt | Select-Object -Last 120
          # Make the result readable without downloading logs (job summary + annotation).
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content test-output.txt | Select-Object -Last 120 | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) {
            $text = (Get-Content test-output.txt | Select-Object -Last 60) -join '%0A'
            Write-Output "::error title=unittest failed::$text"
          }
          exit $code
